name: CADCraft - build A3 drawing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cadcraft-build.yml'
      - 'experiments/cadcraft/ci/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow and builder
        uses: actions/checkout@v4
      - name: Checkout approved geometry checkpoint
        uses: actions/checkout@v4
        with:
          ref: checkpoint/apartment-v20
          path: checkpoint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CAD dependencies
        run: python -m pip install 'ezdxf>=1.3,<2' 'matplotlib>=3.8,<4' 'reportlab>=4,<5'
      - name: Build and validate PDF DXF PNG
        run: |
          python experiments/cadcraft/ci/build_a3.py \
            --geometry checkpoint/experiments/cadcraft/checkpoints/apartment-v35/geometry.json \
            --output dist
      - name: Make monochrome A3 with one left dimension
        run: python experiments/cadcraft/ci/black_white_one_dimension.py
      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: CADCraft-A3-DXF-PDF-PNG
          path: |
            dist/*.dxf
            dist/*.pdf
            dist/*.png
            dist/manifest.json
            dist/bw_manifest.json
          if-no-files-found: error
          retention-days: 30
